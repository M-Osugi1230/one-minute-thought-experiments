[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "one-minute-thought-experiments"
version = "0.3.0"
description = "Semi-automated short-video production pipeline for 1-minute thought experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=2.54.0,<3.0.0",
  "pydantic>=2.10.0,<3.0.0",
  "PyYAML>=6.0.2,<7.0.0",
  "python-dotenv>=1.0.1,<2.0.0",
  "Pillow>=11.3.0,<13.0.0",
  "imageio-ffmpeg>=0.6.0,<1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0,<10.0.0"]

[project.scripts]
thought-pipeline = "thought_pipeline.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
