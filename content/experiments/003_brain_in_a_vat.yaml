id: "003"
slug: "brain_in_a_vat"
title: "水槽の中の脳"
category: "人間・認識／現実"
status: "ready"
template: "mystery_binary_choice"
one_line_summary: "脳だけが水槽内で維持され、コンピュータから現実そっくりの信号を受け取っているなら、今の経験が現実だと確かめられるのかを問う"
core_question: "私たちは、感覚経験だけから外部世界が本当にそのとおり存在すると確かめられるのか"
target_duration:
  min_seconds: 40.0
  ideal_seconds: 48.0
  max_seconds: 55.0
scenario:
  viewer_role: "自分が見聞きし触れている世界を現実だと思って生活している人"
  initial_state: "家族、仕事、痛み、空の色など、日常のあらゆる経験を本物として感じている"
  available_action: "自分の感覚や経験を手がかりに、今いる世界が現実だと確かめようとする"
  action_result: "見る・聞く・触るといった確認も最終的には脳へ届く信号として経験されるため、同じ信号を人工的に与えられる可能性を排除できるかが問題になる"
  inaction_result: "現実かどうかを確かめないまま、経験される世界を現実として受け入れて暮らす"
  constraints:
    - "脳は水槽内で生命維持されているという仮定を置く"
    - "コンピュータが通常の現実経験と区別できないほど精巧な信号を脳へ送り続ける"
    - "視聴者本人には、水槽・コンピュータ・外部の装置を直接観察する手段がない"
    - "第一問では『今ここが現実だと確かめられるか』だけを問う"
choices:
  - label: "A"
    action: "確かめられる"
    consequence: "感覚経験や推論などから、現実であることを確かめられると考える"
  - label: "B"
    action: "確かめられない"
    consequence: "同じ経験を人工的な信号でも再現できるなら、経験だけでは決定的に区別できないと考える"
variation_question: "偽物の世界でも一生幸せに暮らせると分かっているなら、その世界を捨ててまで『現実』を選ぶか"
philosophical_focus:
  primary: "外部世界に関する懐疑と、経験から現実を確かめることの限界"
  avoid_overclaiming:
    - "『私たちは実際に水槽の中の脳である』と主張しない"
    - "この思考実験だけで外部世界が存在しないと証明できるとは言わない"
    - "ヒラリー・パトナム本人が単純に懐疑論を支持したと説明しない。『水槽の中の脳』はパトナムの反懐疑論的な議論でも用いられる"
    - "映画やシミュレーション仮説と完全に同一の議論だとは扱わない"
facts:
  - "『水槽の中の脳（brain in a vat）』は、身体から切り離された脳が液体中で維持され、コンピュータから信号を受け取ることで通常と区別できない経験をするという思考実験である"
  - "この設定は、感覚経験が同じであれば、経験している本人が外部世界の状態をどこまで確かめられるのかという懐疑の問題を鋭くする"
  - "ヒラリー・パトナムは『Reason, Truth and History』でこの設定を論じ、単に懐疑論を提示するだけでなく、意味の外在主義を用いて『私たちは水槽の中の脳である』という全面的懐疑に反論しようとした"
sources:
  - author: "Hilary Putnam"
    title: "Reason, Truth and History"
    year: 1981
    kind: "primary"
    locator: "Chapter 1: Brains in a Vat"
  - author: "岡本裕一朗"
    title: "思考実験大全"
    year: 2025
    kind: "secondary"
    locator: "第1章『人間』・3『水槽の中の脳』"
content_rules:
  must_include:
    - "脳だけが水槽の中にあるという仮定"
    - "コンピュータが現実そっくりの信号を送り続けること"
    - "感覚による確認も脳に届く情報であるという疑問"
    - "最初に『確かめられる／確かめられない』を中立に選ばせること"
    - "『偽物でも一生幸せなら現実へ戻るか』という条件変更"
    - "『水槽の中の脳』という名称はPage 7で初めて公開すること"
    - "Page 8で再回答とコメント誘導を行うこと"
  must_not_include:
    - "最初から思考実験名を見せること"
    - "A/Bのどちらかを正解扱いすること"
    - "パトナム本人の議論を単純な懐疑論支持として説明すること"
    - "『現実は偽物だ』と断定すること"
    - "書籍本文の転載やKindle画面の使用"
