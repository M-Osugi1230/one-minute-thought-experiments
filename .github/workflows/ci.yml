name: ADE deterministic compile proof

on:
  push:
    branches:
      - ade-compile-proof-pr3

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 954eabde5048a1a2f82f70af62143fe4588884d9
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: test "$(git rev-parse HEAD)" = "954eabde5048a1a2f82f70af62143fe4588884d9"
      - run: python -m compileall -q src pipeline.py
