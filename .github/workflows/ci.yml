name: Phase 1 and 2 checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python pipeline.py validate
      - run: python -m pytest
      - name: Runtime package import smoke
        run: |
          python -m venv .runtime-smoke
          .runtime-smoke/bin/python -m pip install --upgrade pip
          .runtime-smoke/bin/python -m pip install .
          .runtime-smoke/bin/python - <<'PY'
          import importlib
          import pkgutil
          import thought_pipeline

          failures = []
          for module in pkgutil.walk_packages(
              thought_pipeline.__path__,
              thought_pipeline.__name__ + ".",
          ):
              try:
                  importlib.import_module(module.name)
              except Exception as exc:
                  failures.append(f"{module.name}: {type(exc).__name__}: {exc}")

          if failures:
              raise SystemExit("runtime import failures:\n" + "\n".join(failures))
          PY
      - run: python pipeline.py 001 --offline
