name: TikTok Analytics Snapshot

on:
  workflow_dispatch:
  schedule:
    # Every 6 hours. This captures early post velocity without excessive polling.
    - cron: "20 3,9,15,21 * * *"

concurrency:
  group: tiktok-analytics
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install analytics dependencies
        run: python -m pip install --disable-pip-version-check "cryptography>=43,<47" "python-dotenv>=1,<2"

      - name: Collect TikTok snapshot
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_TOKEN_ENCRYPTION_KEY: ${{ secrets.TIKTOK_TOKEN_ENCRYPTION_KEY }}
          # Used only if analytics/private/tiktok_refresh_token.fernet does not exist yet.
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_ACCOUNT_KEY: "1minshiko"
          TIKTOK_MAX_POSTS: "100"
        run: python scripts/tiktok_analytics.py collect

      - name: Commit analytics history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analytics
          if git diff --cached --quiet; then
            echo "No analytics changes to commit."
            exit 0
          fi
          git commit -m "chore: snapshot TikTok analytics"
          git pull --rebase origin main
          git push origin HEAD:main
